name: Deploy GitHub Pages Showcase

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Visual Assets to Docs
        run: |
          mkdir -p docs/assets
          cp -r assets/* docs/assets/ || true
          cp image.png docs/ || true
          cp linkedin.svg docs/ || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
