<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="628" fill="url(#bgGrad)"/>
  <circle cx="1100" cy="100" r="300" fill="#e0f2fe" opacity="0.4"/>
  <circle cx="100" cy="550" r="250" fill="#d1fae5" opacity="0.4"/>

  <!-- Top Brand Header -->
  <g transform="translate(60, 50)">
    <rect width="140" height="36" rx="18" fill="#e0f2fe"/>
    <text x="70" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0284c7" text-anchor="middle">DATHEON AI</text>
    
    <text x="160" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748b">ENTERPRISE CONVERSATIONAL COMMERCE</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">
    Autonomous WhatsApp AI Lead Qualification
  </text>
  <text x="60" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#emeraldGrad)" letter-spacing="-0.02em">
    &amp; Real-Time Calendar Booking Platform
  </text>
  <text x="60" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#475569">
    Cryptographic Meta Webhooks • Structured LLM Extraction • Race-Free Scheduling • CRM Sync • Human Escalation
  </text>

  <!-- 4 Architecture Cards -->
  <g transform="translate(60, 275)">
    <!-- Card 1: Webhook & Security -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="250" height="230" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#ecfdf5"/>
      <text x="42" y="47" font-family="sans-serif" font-size="20" text-anchor="middle">🔐</text>
      <text x="20" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0f172a">HMAC Security</text>
      <text x="20" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Meta HMAC-SHA256
      </text>
      <text x="20" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Message ID Idempotency
      </text>
      <text x="20" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Replay Attack Guard
      </text>
      <text x="20" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Fast 200 Ack Queue
      </text>
    </g>

    <!-- Card 2: AI Qualification -->
    <g transform="translate(275, 0)" filter="url(#shadow)">
      <rect width="250" height="230" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#eff6ff"/>
      <text x="42" y="47" font-family="sans-serif" font-size="20" text-anchor="middle">🧠</text>
      <text x="20" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AI Qualification</text>
      <text x="20" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Strict Pydantic Schema
      </text>
      <text x="20" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Anti-Prompt Injection
      </text>
      <text x="20" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Zero Hallucination
      </text>
      <text x="20" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • One Question at a Time
      </text>
    </g>

    <!-- Card 3: 2-Phase Booking -->
    <g transform="translate(550, 0)" filter="url(#shadow)">
      <rect width="250" height="230" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#fef3c7"/>
      <text x="42" y="47" font-family="sans-serif" font-size="20" text-anchor="middle">📅</text>
      <text x="20" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0f172a">2-Phase Booking</text>
      <text x="20" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Google / Cal.com APIs
      </text>
      <text x="20" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Race-Condition Precheck
      </text>
      <text x="20" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Explicit Confirmation
      </text>
      <text x="20" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Timezone &amp; Buffer Aware
      </text>
    </g>

    <!-- Card 4: CRM & Escalation -->
    <g transform="translate(825, 0)" filter="url(#shadow)">
      <rect width="250" height="230" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#fce7f3"/>
      <text x="42" y="47" font-family="sans-serif" font-size="20" text-anchor="middle">🚨</text>
      <text x="20" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#0f172a">CRM &amp; Escalation</text>
      <text x="20" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Airtable &amp; Webhooks
      </text>
      <text x="20" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Auto CRM Reconciliation
      </text>
      <text x="20" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Instant Silence on Anger
      </text>
      <text x="20" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#64748b">
        • Slack Takeover Cards
      </text>
    </g>
  </g>

  <!-- Bottom Badges Bar -->
  <g transform="translate(60, 545)">
    <rect width="1075" height="48" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <g transform="translate(30, 14)">
      <circle cx="10" cy="10" r="5" fill="#10b981"/>
      <text x="25" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#0f172a">25/25 Tests Passing (100%)</text>
    </g>

    <g transform="translate(280, 14)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#475569">⚡ FastAPI + Uvicorn</text>
    </g>

    <g transform="translate(460, 14)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#475569">🐍 Python 3.12</text>
    </g>

    <g transform="translate(610, 14)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#475569">🗄️ SQLAlchemy 2.0 Async</text>
    </g>

    <g transform="translate(830, 14)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#475569">📊 Prometheus &amp; Health Probes</text>
    </g>
  </g>
</svg>
