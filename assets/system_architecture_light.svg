<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    Datheon Platform • End-to-End System Architecture (Light Theme)
  </text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748b">
    From inbound webhook cryptographic verification to structured qualification, two-phase booking, and human escalation.
  </text>

  <!-- Column 1: Meta Ingestion -->
  <g transform="translate(40, 100)">
    <rect width="190" height="370" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="15" y="15" width="160" height="32" rx="6" fill="#ecfdf5"/>
    <text x="95" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">1. Meta Cloud Webhook</text>

    <!-- Node A -->
    <rect x="15" y="65" width="160" height="65" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="88" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">POST /webhook</text>
    <text x="25" y="105" font-family="sans-serif" font-size="11" fill="#64748b">X-Hub-Signature-256</text>
    <text x="25" y="120" font-family="sans-serif" font-size="11" fill="#64748b">Raw body capture</text>

    <!-- Node B -->
    <rect x="15" y="150" width="160" height="65" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="173" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">HMAC-SHA256</text>
    <text x="25" y="190" font-family="sans-serif" font-size="11" fill="#64748b">Constant-time digest</text>
    <text x="25" y="205" font-family="sans-serif" font-size="11" fill="#0284c7">401 on mismatch</text>

    <!-- Node C -->
    <rect x="15" y="235" width="160" height="65" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="258" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Idempotency Guard</text>
    <text x="25" y="275" font-family="sans-serif" font-size="11" fill="#64748b">Provider Message ID</text>
    <text x="25" y="290" font-family="sans-serif" font-size="11" fill="#10b981">Replay deduplicated</text>

    <!-- Fast Ack -->
    <rect x="15" y="315" width="160" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="95" y="340" font-family="sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">⚡ Fast HTTP 200 Ack</text>
  </g>

  <!-- Arrow Col 1 -> Col 2 -->
  <line x1="230" y1="267" x2="275" y2="267" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 2: State & Orchestration -->
  <g transform="translate(280, 100)">
    <rect width="210" height="370" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="15" y="15" width="180" height="32" rx="6" fill="#eff6ff"/>
    <text x="105" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">2. State Orchestration</text>

    <!-- Conversation State Machine -->
    <rect x="15" y="65" width="180" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="88" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">State Machine</text>
    <text x="25" y="108" font-family="sans-serif" font-size="11" fill="#475569">• NEW → GREETING</text>
    <text x="25" y="126" font-family="sans-serif" font-size="11" fill="#475569">• QUALIFICATION</text>
    <text x="25" y="144" font-family="sans-serif" font-size="11" fill="#475569">• QUALIFIED / REJECT</text>
    <text x="25" y="162" font-family="sans-serif" font-size="11" fill="#475569">• BOOKING → BOOKED</text>
    <text x="25" y="180" font-family="sans-serif" font-size="11" fill="#dc2626">• HUMAN_HANDOFF</text>

    <!-- Async Database Persistence -->
    <rect x="15" y="215" width="180" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="238" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Database Persistence</text>
    <text x="25" y="258" font-family="sans-serif" font-size="11" fill="#64748b">SQLAlchemy 2.0 Async</text>
    <text x="25" y="278" font-family="sans-serif" font-size="11" fill="#64748b">PostgreSQL / SQLite</text>
    <text x="25" y="298" font-family="sans-serif" font-size="11" fill="#64748b">Alembic Migrations</text>
    <text x="25" y="318" font-family="sans-serif" font-size="11" fill="#64748b">Dead-Letter Queue</text>
    <text x="25" y="338" font-family="sans-serif" font-size="11" fill="#64748b">Audit Trails &amp; Logs</text>
  </g>

  <!-- Arrow Col 2 -> Col 3 -->
  <line x1="490" y1="210" x2="535" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="380" x2="535" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 3: AI Qualification & Frustration -->
  <g transform="translate(540, 100)">
    <rect width="200" height="370" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="15" y="15" width="170" height="32" rx="6" fill="#fef3c7"/>
    <text x="100" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">3. AI &amp; Qualification</text>

    <!-- Structured LLM -->
    <rect x="15" y="65" width="170" height="95" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="88" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Structured Extraction</text>
    <text x="25" y="106" font-family="sans-serif" font-size="11" fill="#64748b">Strict Pydantic models</text>
    <text x="25" y="124" font-family="sans-serif" font-size="11" fill="#64748b">Budget, Size, Authority</text>
    <text x="25" y="142" font-family="sans-serif" font-size="11" fill="#64748b">Prompt Injection Fence</text>

    <!-- Rules Engine -->
    <rect x="15" y="170" width="170" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="193" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Rules Engine</text>
    <text x="25" y="211" font-family="sans-serif" font-size="11" fill="#64748b">Budget ≥ $1,000</text>
    <text x="25" y="229" font-family="sans-serif" font-size="11" fill="#64748b">Team Size ≥ 5 staff</text>
    <text x="25" y="247" font-family="sans-serif" font-size="11" fill="#10b981">Decoupled from AI conf.</text>

    <!-- Frustration Detector -->
    <rect x="15" y="265" width="170" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="288" font-family="sans-serif" font-size="12" font-weight="700" fill="#dc2626">Frustration Engine</text>
    <text x="25" y="306" font-family="sans-serif" font-size="11" fill="#64748b">Keyword / Anger rules</text>
    <text x="25" y="324" font-family="sans-serif" font-size="11" fill="#64748b">Loop &amp; repeat detector</text>
    <text x="25" y="342" font-family="sans-serif" font-size="11" fill="#dc2626">Immediate bot silence</text>
  </g>

  <!-- Arrow Col 3 -> Col 4 -->
  <line x1="740" y1="210" x2="785" y2="210" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="740" y1="310" x2="785" y2="310" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 4: Integrations & Escalations -->
  <g transform="translate(790, 100)">
    <rect width="170" height="370" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="15" y="15" width="140" height="32" rx="6" fill="#fdf2f8"/>
    <text x="85" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#9d174d" text-anchor="middle">4. Actions &amp; Sync</text>

    <!-- Calendar Booking -->
    <rect x="15" y="65" width="140" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="23" y="88" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Calendar Booking</text>
    <text x="23" y="106" font-family="sans-serif" font-size="11" fill="#64748b">Google / Cal.com</text>
    <text x="23" y="124" font-family="sans-serif" font-size="11" fill="#64748b">2-Phase Slot Lock</text>
    <text x="23" y="142" font-family="sans-serif" font-size="11" fill="#10b981">Race-free verify</text>

    <!-- CRM Sync -->
    <rect x="15" y="165" width="140" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="23" y="188" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">CRM Sync</text>
    <text x="23" y="206" font-family="sans-serif" font-size="11" fill="#64748b">Airtable / Webhook</text>
    <text x="23" y="224" font-family="sans-serif" font-size="11" fill="#64748b">Auto reconciliation</text>
    <text x="23" y="242" font-family="sans-serif" font-size="11" fill="#0284c7">Safe partial failures</text>

    <!-- Human Takeover -->
    <rect x="15" y="265" width="140" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="23" y="288" font-family="sans-serif" font-size="12" font-weight="700" fill="#dc2626">Human Takeover</text>
    <text x="23" y="306" font-family="sans-serif" font-size="11" fill="#64748b">Slack Block Kit</text>
    <text x="23" y="324" font-family="sans-serif" font-size="11" fill="#64748b">Admin Resolve API</text>
    <text x="23" y="342" font-family="sans-serif" font-size="11" fill="#0f172a">1-Click agent link</text>
  </g>
</svg>
