[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datheon-whatsapp-lead-qualification-bot"
version = "1.0.0"
description = "Autonomous WhatsApp AI Lead Qualification, Calendar Booking & Human Escalation Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Datheon Engineering", email = "engineering@datheon.ai" }
]
keywords = ["whatsapp", "fastapi", "ai-qualification", "calendar-booking", "crm", "lead-generation"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "python-dateutil>=2.9.0",
    "tenacity>=8.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.6.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
